# Builds the installers for macOS (dmg), Windows (msi, exe) and Linux
# (deb, AppImage).
#
# - Push a tag like `v0.1.0`: builds everything and attaches it to a draft
#   GitHub release for that tag.
# - Run manually (Actions > Release > Run workflow): builds everything and
#   keeps the installers as workflow artifacts, without making a release.
#
# macOS signing and notarization happen only when these repository secrets
# are set; without them the app is built unsigned:
#   APPLE_CERTIFICATE            base64 of the Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD   password of that .p12
#   APPLE_SIGNING_IDENTITY       e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_ID, APPLE_PASSWORD     Apple ID and an app-specific password
#   APPLE_TEAM_ID
# The macOS jobs check the certificate and its password before building.
# To set the two together, from the folder holding the exported .p12:
#   base64 -i certificate.p12 | gh secret set APPLE_CERTIFICATE
#   gh secret set APPLE_CERTIFICATE_PASSWORD      (asks for it; type or paste)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # HEIC: macOS decodes it natively, Linux uses the libheif package,
          # and Windows is built without it for now (see "Packaging" in the
          # README).
          - name: Linux x64
            os: ubuntu-24.04
            args: ""
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          - name: Windows x64
            os: windows-latest
            args: "-- --no-default-features"

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev pkg-config patchelf file \
            libheif-dev libheif-plugin-libde265

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      # Pass the signing settings on only if they exist: an empty certificate
      # variable would make the build try (and fail) to sign.
      - name: Enable macOS signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No signing certificate configured: building unsigned."
            exit 0
          fi

          # Check the certificate and its password now, the way the build
          # will use them, rather than after a five-minute build. Nothing
          # secret is printed.
          cert="$RUNNER_TEMP/certificate.p12"
          if ! printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$cert" 2>/dev/null; then
            echo "::error::APPLE_CERTIFICATE is not valid base64. Set it again with: base64 -i certificate.p12 | gh secret set APPLE_CERTIFICATE"
            exit 1
          fi
          echo "Certificate: $(wc -c < "$cert" | tr -d ' ') bytes (compare with the size of your .p12 file)."
          keychain="$RUNNER_TEMP/check.keychain-db"
          security create-keychain -p check "$keychain"
          imports() { # file password
            security import "$1" -k "$keychain" -P "$2" -T /usr/bin/codesign > /dev/null 2>&1
          }
          # Apple's `security` cannot read a .p12 in the format OpenSSL 3 and
          # later write by default, and says "wrong password" about it. If
          # OpenSSL opens the file, rewrite it in the older format.
          ossl=""
          for candidate in "$(brew --prefix openssl@3 2>/dev/null)/bin/openssl" "$(command -v openssl)"; do
            if [ -x "$candidate" ] && "$candidate" version | grep -qE '^OpenSSL [3-9]'; then
              ossl="$candidate"
              break
            fi
          done
          if [ -n "$ossl" ]; then
            echo "A .p12 in the newer format can be converted with: $("$ossl" version)."
          else
            echo "No OpenSSL 3 here: a .p12 in the newer format cannot be converted."
          fi
          converts() { # password
            [ -n "$ossl" ] || return 1
            local pem="$RUNNER_TEMP/certificate.pem" legacy="$RUNNER_TEMP/legacy.p12"
            PASS="$1" "$ossl" pkcs12 -in "$cert" -nodes -passin env:PASS -out "$pem" 2>/dev/null &&
              PASS="$1" "$ossl" pkcs12 -export -legacy -in "$pem" -out "$legacy" -passout env:PASS 2>/dev/null &&
              imports "$legacy" "$1" &&
              APPLE_CERTIFICATE="$(base64 -i "$legacy")"
            local result=$?
            rm -f "$pem" "$legacy"
            return $result
          }
          # A password pasted with a trailing newline or space is the usual
          # slip: accept it without them, and say so.
          trimmed="$(printf '%s' "$APPLE_CERTIFICATE_PASSWORD" | sed -e 's/[[:space:]]*$//')"
          found=""
          for password in "$APPLE_CERTIFICATE_PASSWORD" "$trimmed"; do
            if imports "$cert" "$password"; then
              found="as is"
            elif converts "$password"; then
              found="converted"
              echo "::warning::The .p12 file is in a format macOS cannot import (written by OpenSSL 3 or later); it was converted for this build. Export it with the legacy option to avoid this."
            fi
            if [ -n "$found" ]; then
              if [ "$password" != "$APPLE_CERTIFICATE_PASSWORD" ]; then
                echo "::warning::APPLE_CERTIFICATE_PASSWORD ends with spaces or a newline; using it without them."
                APPLE_CERTIFICATE_PASSWORD="$password"
              fi
              break
            fi
          done
          security delete-keychain "$keychain"
          rm -f "$cert"
          if [ -z "$found" ]; then
            echo "::error::APPLE_CERTIFICATE_PASSWORD does not open APPLE_CERTIFICATE. They must come from the same export of the .p12 file: export it again from Keychain Access, then set both secrets (see the header of this file)."
            exit 1
          fi
          echo "The certificate and its password work."

          # The multi-line form keeps values intact whatever they contain.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!name}" ]; then
              delimiter="END_$(openssl rand -hex 8)"
              {
                echo "$name<<$delimiter"
                printf '%s\n' "${!name}"
                echo "$delimiter"
              } >> "$GITHUB_ENV"
            fi
          done

      - name: Build and attach to a draft release
        if: github.ref_type == 'tag'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Photolib ${{ github.ref_name }}
          releaseDraft: true
          args: ${{ matrix.args }}

      - name: Build only
        if: github.ref_type != 'tag'
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}

      - name: Keep the installers as artifacts
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: photolib-${{ matrix.target || runner.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/appimage/*.AppImage
