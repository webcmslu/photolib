[package]
name = "photolib"
version = "0.1.0"
description = "Cross-platform photo browser where the library is any folder"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
# The `_lib` suffix avoids a name clash between the library and the binary on Windows.
name = "photolib_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
