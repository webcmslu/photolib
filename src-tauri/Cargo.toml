[package]
name = "photolib"
version = "0.1.10"
description = "Cross-platform photo browser where the library is any folder"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.88"
publish = false

[lib]
# The `_lib` suffix avoids a name clash between the library and the binary on Windows.
name = "photolib_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Compiles the Objective-C bridge to ImageCaptureCore (iPhone import, macOS).
cc = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
walkdir = "2.5.0"
blake3 = "1.8.7"
kamadak-exif = "0.6.2"
rayon = "1.12.0"
chrono = "0.4.45"
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png", "webp", "gif", "tiff"] }
fast_image_resize = "5.1.4"
getrandom = "0.3"
# Runs the face detection and recognition models (pure Rust, no system library).
tract-onnx = "0.23"
# Downloads those models the first time face grouping is switched on.
ureq = "2"

# macOS decodes HEIC with its own ImageIO framework (see heic_macos.rs), so
# libheif is only used on the other systems.
[target.'cfg(not(target_os = "macos"))'.dependencies]
# Only the oldest API level we need, so the build accepts any libheif >= 1.17
# (Homebrew, Debian and vcpkg ship different versions).
libheif-rs = { version = "3.0.0", optional = true, default-features = false, features = ["v1_17"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

[features]
default = ["heic"]
# HEIC/HEIF support through the libheif system library, needed at build time.
# Has no effect on macOS, where HEIC always works.
heic = ["dep:libheif-rs"]

[dev-dependencies]
tempfile = "3"

# Optimize debug builds too: unoptimized image decoding and resizing are about
# 20x slower, far too slow to develop against. This must cover our own crate as
# well as the dependencies, because their generic code is compiled into ours.
[profile.dev]
opt-level = 2
