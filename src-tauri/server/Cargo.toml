[package]
name = "phototek-server"
version.workspace = true
description = "Phototek on a NAS: indexes the photo folder and serves it to browsers, phones and TVs"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.90"
publish = false

[dependencies]
phototek-core = { path = "../core" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
base64 = "0.22"
blake3 = "1.8.7"

[dev-dependencies]
tempfile = "3"
