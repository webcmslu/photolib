[package]
name = "phototek-core"
version.workspace = true
description = "Phototek's library: index, thumbnails, faces, people, memories, map and search"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.90"
publish = false

# Everything here is plain Rust with no user interface, shared by the
# desktop app (Tauri) and the server that runs on a NAS.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
walkdir = "2.5.0"
blake3 = "1.8.7"
kamadak-exif = "0.6.2"
rayon = "1.12.0"
chrono = "0.4.45"
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png", "webp", "gif", "tiff"] }
fast_image_resize = "5.1.4"
getrandom = "0.3"
# Runs the face detection and recognition models (pure Rust, no system library).
tract-onnx = "0.23"
# Downloads those models the first time face grouping is switched on.
ureq = "2"

# macOS decodes HEIC with its own ImageIO framework (see heic_macos.rs), so
# libheif is only used on the other systems.
[target.'cfg(not(target_os = "macos"))'.dependencies]
# Only the oldest API level we need, so the build accepts any libheif >= 1.17
# (Homebrew, Debian and vcpkg ship different versions).
libheif-rs = { version = "3.0.0", optional = true, default-features = false, features = ["v1_17"] }

[features]
default = ["heic"]
# HEIC/HEIF support through the libheif system library, needed at build time.
# Has no effect on macOS, where HEIC always works.
heic = ["dep:libheif-rs"]
# Helpers for the tests of the crates built on this one.
test-support = []

[dev-dependencies]
tempfile = "3"
